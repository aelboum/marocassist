# MarocAssist local development stack. DEVELOPMENT ONLY -- not a production
# deployment: no TLS, local identity provider, Mailpit mail catcher.
#
#   ./scripts/dev-env.sh          # first time: creates .env with random local secrets
#   docker compose up -d --build
#   docker compose logs zitadel-bootstrap   # copy OIDC_CLIENT_ID into .env once
#   docker compose up -d backend worker
#
# Browser origin (single origin, SaaS-OS ADR-0024): http://localhost:8080
#   /auth/*, /v1/*, /healthz, /readyz  -> backend
#   everything else                    -> web (Next.js)
# Copilot test website (extension prototype): http://localhost:8090
#
# Modelled on SaaS-OS v0.15.0's docker-compose.yml (consumer guide; LOCAL-
# IDENTITY.md "Downstream product development"). Every value comes from the
# gitignored .env; nothing secret is written here. Host ports are bound to
# 127.0.0.1 only.

name: marocassist

# Each process gets only the variables it needs (least privilege): the
# API and the worker never see the migration role, the ZITADEL master key
# or the ZITADEL admin password; `migrate` never sees OIDC settings.
x-runtime-env: &runtime-env
  environment:
    ENVIRONMENT: ${ENVIRONMENT}
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
    PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN}
    AUTH_POST_LOGIN_PATH: ${AUTH_POST_LOGIN_PATH}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
    OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    EMAIL_PROVIDER: ${EMAIL_PROVIDER}
    EMAIL_DEFAULT_SENDER: ${EMAIL_DEFAULT_SENDER}
    MAROCASSIST_COPILOT_KEY_TTL_SECONDS: ${MAROCASSIST_COPILOT_KEY_TTL_SECONDS}
    MAROCASSIST_COPILOT_MAX_DEVICES: ${MAROCASSIST_COPILOT_MAX_DEVICES}

x-migrate-env: &migrate-env
  environment:
    ENVIRONMENT: ${ENVIRONMENT}
    DATABASE_URL: ${DATABASE_URL}
    MIGRATIONS_DATABASE_URL: ${MIGRATIONS_DATABASE_URL}
    APP_DB_USER: ${APP_DB_USER}
    REDIS_URL: ${REDIS_URL}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/dev-env.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/dev-env.sh}
      APP_DB_USER: ${APP_DB_USER:?run scripts/dev-env.sh}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run scripts/dev-env.sh}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"   # integration tests from the host
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"   # integration tests from the host
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025"

  # One-shot: SaaS-OS migrations, MarocAssist migrations, permissions.
  migrate:
    build: ./backend
    <<: *migrate-env
    command: ["python", "-m", "marocassist.migrate"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    <<: *runtime-env
    ports:
      - "127.0.0.1:8000:8000"   # developer escape hatch (/docs); browsers use the edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    build: ./backend
    <<: *runtime-env
    command: ["python", "-m", "marocassist.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "marocassist.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  web:
    build: ./web
    environment:
      # Server-side rendering calls the backend over the Compose network;
      # the browser always uses relative URLs on the single origin.
      BACKEND_INTERNAL_ORIGIN: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"   # developer escape hatch; browsers use the edge
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Single-origin edge (SaaS-OS ADR-0024). deploy/edge/Caddyfile was emitted
  # by `saas-os-edge-config` from the pinned package and is product-owned.
  edge:
    image: caddy:2-alpine
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      SAAS_OS_FRONTEND_INTERNAL_ORIGIN: http://web:3000
    ports:
      - "127.0.0.1:${SAAS_OS_EDGE_PORT:-8080}:8080"
    volumes:
      - ./deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - web
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local test website for the Copilot extension prototype: a fictitious
  # form, never a copy of an official site.
  copilot-testsite:
    image: caddy:2-alpine
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8090"]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./extension/testsite:/srv:ro

  # --- Local identity provider (ZITADEL), as SaaS-OS LOCAL-IDENTITY.md ---
  zitadel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ZITADEL_DB_USER}
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD}
      POSTGRES_DB: ${ZITADEL_DB_NAME}
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zitadel-bootstrap-vol-init:
    image: busybox:1.36.1
    command: ["sh", "-c", "mkdir -p /bootstrap && chmod 0777 /bootstrap"]
    volumes:
      - zitadel-bootstrap:/bootstrap

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.5
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_LOCAL_MASTERKEY:?run scripts/dev-env.sh}
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_PORT: ${ZITADEL_LOCAL_PORT}
      ZITADEL_EXTERNALDOMAIN: zitadel.localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_LOCAL_PORT}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: marocassist-local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_FIRSTINSTANCE_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # Account lifecycle (Phase 2): self-registration, email verification
      # and password reset mails go to the local Mailpit (development only,
      # no TLS, no credentials; Mailpit never delivers anything). MFA is
      # offered but not forced (decision P2-1).
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "true"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_FORCEMFA: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: no-reply@marocassist.localhost
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: MarocAssist (local)
    ports:
      - "127.0.0.1:${ZITADEL_LOCAL_PORT}:${ZITADEL_LOCAL_PORT}"
    volumes:
      - zitadel-bootstrap:/bootstrap
    networks:
      default:
        aliases:
          - zitadel.localhost
    depends_on:
      mailpit:
        condition: service_started
      zitadel-db:
        condition: service_healthy
      zitadel-bootstrap-vol-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  zitadel-bootstrap:
    build: ./backend
    entrypoint: ["saas-os-local-identity"]
    environment:
      ZITADEL_INTERNAL_URL: http://zitadel.localhost:${ZITADEL_LOCAL_PORT}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN}
      OIDC_LOCAL_PROJECT_NAME: ${OIDC_LOCAL_PROJECT_NAME:-marocassist}
      OIDC_LOCAL_APPLICATION_NAME: ${OIDC_LOCAL_APPLICATION_NAME:-marocassist-backend}
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  zitadel-db-data:
  zitadel-bootstrap:
