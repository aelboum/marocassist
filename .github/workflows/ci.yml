name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; a run on main never is.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# SaaS-OS is a public repository consumed as a Git dependency pinned to one
# commit (docs/adr/0001-saas-os-pin-and-boundary.md), so no credential is
# needed and no job receives a secret. Third-party actions are pinned by
# commit SHA. Service containers and their passwords are disposable and
# CI-only; they are never a shared or production server. Container images
# are pinned by digest; checkout never stores the job token on disk.
env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  UV_PYTHON_DOWNLOADS: never

jobs:
  backend:
    name: backend (lint, types, architecture, unit, OpenAPI drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Lockfile is current
        run: uv lock --check
      - name: Install exactly the locked environment
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Mypy (strict)
        run: uv run --locked mypy
      - name: Import contracts
        run: uv run --locked lint-imports --no-cache
      - name: Unit, architecture and contract tests
        run: uv run --locked pytest -p no:cacheprovider
      - name: Knowledge content dry run (rights, PII, sanitiser, allow-list, four-eyes)
        # No database: checks the bundle in knowledge/ once it has a manifest.
        run: |
          if [ -f ../knowledge/manifest.json ]; then
            uv run --locked python -m marocassist.knowledge.loader --dry-run ../knowledge
          else
            echo "knowledge/ has no manifest.json yet; nothing to check"
          fi

  integration:
    name: integration (PostgreSQL 16, Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: marocassist_ci
          POSTGRES_PASSWORD: ci-only-placeholder # pragma: allowlist secret
          POSTGRES_DB: marocassist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marocassist_ci -d marocassist"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: marocassist_ci
      POSTGRES_DB: marocassist
      APP_DB_USER: marocassist_app
      APP_DB_PASSWORD: ci-only-app-placeholder # pragma: allowlist secret
      PGHOST: 127.0.0.1
      PGPASSWORD: ci-only-placeholder # pragma: allowlist secret
      DATABASE_URL: postgresql+psycopg://marocassist_app:ci-only-app-placeholder@127.0.0.1:5432/marocassist # pragma: allowlist secret
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://marocassist_ci:ci-only-placeholder@127.0.0.1:5432/marocassist # pragma: allowlist secret
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Create the restricted application role (same script as Compose)
        run: bash deploy/postgres/init/01-create-app-role.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install exactly the locked environment
        working-directory: backend
        run: uv sync --locked
      - name: Integration tests (migrations, role guard, isolation, pairing, audit)
        working-directory: backend
        run: uv run --locked pytest -m integration -p no:cacheprovider

  web:
    name: web (types, lint, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exactly the locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Audit dependencies
        run: npm audit --audit-level=high

  extension:
    name: extension (types, lint, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exactly the locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Tests (incl. manifest permission snapshot and security scans)
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  security:
    name: security (dependency audit, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      # Every locked PyPI package, exact versions. SaaS-OS itself is a Git
      # commit, not a PyPI release, so no advisory database covers it; it is
      # left out of this list and tracked through the pinned SHA (ADR-0001).
      - name: Python dependency audit (locked runtime and dev dependencies)
        working-directory: backend
        run: |
          uv export --locked --format requirements-txt --no-emit-project --no-hashes \
            | grep -v '^saas-os @' > "$RUNNER_TEMP/requirements.txt"
          uv run --locked pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - name: Secret scan of the full Git history
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          git /repo --redact --no-banner --exit-code 1
